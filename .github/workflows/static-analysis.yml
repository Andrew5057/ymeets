name: Static Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prettier:
    name: Run Prettier formatter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install

      - name: Format w/ Prettier
        run: npx prettier . --check

      - name: Lint w/ ESlint
        run: npx eslint . --max-warnings 0
